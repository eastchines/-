name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pynput pywin32 pyinstaller

      - run: pyinstaller -w -F --clean --add-data "beast_body.png;." --add-data "beast_hand_empty.png;." --add-data "beast_hand_press.png;." --add-data "girl_body.png;." --add-data "girl_hand_empty.png;." --add-data "girl_hand_press.png;." main.py -n "DesktopPet"

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopPet-exe
          path: dist/DesktopPet.exe
